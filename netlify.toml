[build]
  command = "npm run build"
  publish = "dist"

# Hashed assets never change — cache for a year, immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html + SPA routes revalidate so new deploys go live at once.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"